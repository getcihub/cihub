version: 1
queues:
  # First: `main` has no route_conditions and takes every PR.
  - name: hotfix
    branch: main
    strategy: sequential
    route_conditions:
      - head ~= ^hotfix/
    queue_conditions:
      - -draft
      - -label = do-not-merge
      - check-success = CI
    merge_conditions:
      - check-success = CI
  - name: main
    branch: main
    strategy: batched
    batching: { size: 3, max_wait_minutes: 1 }
    merge_method: merge_commit
    queue_conditions:
      - -draft
      - -label = do-not-merge
      # ci.yml skips CI on the release-please PR; the test branch
      # of the queue still runs it in full.
      - or:
          - check-success = CI
          - check-skipped = CI
    merge_conditions:
      - check-success = CI
