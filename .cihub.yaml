# yaml-language-server: $schema=https://cihub.io/schema/config/v1.json
version: 1
queues:
  - branch: main
    strategy: batched
    batching:
      size: 3
      max_wait_minutes: 1
    queue_conditions:
      draft: false
      labels:
        none:
          - do-not-merge
      checks:
        success:
          - Build Success
    merge_conditions:
      checks:
        success:
          - Build Success
priority_rules:
  - name: renovate
    conditions:
      author: cihub-renovate[bot]
    priority: low
