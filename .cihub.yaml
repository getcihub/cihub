version: 1
queues:
  - name: hotfix
    branch: main
    strategy: sequential
    route_conditions:
      - head ~= ^hotfix/
    queue_conditions:
      - -draft
      - -label = do-not-merge
      - check-success = CI
    merge_conditions:
      - check-success = CI
  - name: main
    branch: main
    strategy: batched
    batching: { size: 3, max_wait_minutes: 1 }
    queue_conditions:
      - -draft
      - -label = do-not-merge
      - check-success = CI
    merge_conditions:
      - check-success = CI
