version: 1
queues:
  - branch: main
    strategy: batched
    batching: { size: 3, max_wait_minutes: 1 }
    queue_conditions:
      - -draft
      - -label = do-not-merge
      - check-success = Build Success
    merge_conditions:
      - check-success = Build Success
priority_rules:
  - name: renovate
    conditions:
      - author = cihub-renovate[bot]
    priority: low
