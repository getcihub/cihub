<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <title>CIHub: Never break main again.</title>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E86FF"/>
      <stop offset="1" stop-color="#006FFF"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D5DAE1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade-mask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
    <filter id="card" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="#FFFFFF" stroke="#E6E9ED"/>
  <rect x="1" y="1" width="1278" height="318" rx="16" fill="url(#dots)" mask="url(#fade-mask)"/>

  <g transform="translate(88 104)">
    <rect width="56" height="56" rx="14" fill="url(#mark)"/>
    <path d="M20 16 V40 M36 18 Q36 32 20 34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="4" fill="#FFFFFF"/>
    <circle cx="20" cy="41" r="4" fill="#FFFFFF"/>
    <circle cx="36" cy="17" r="4" fill="#FFFFFF"/>
  </g>
  <text x="160" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#14171C">CIHub</text>
  <text x="88" y="206" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#4B5563">Never break main again.</text>
  <text x="88" y="240" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" fill="#9AA1AB">SELF-HOSTED · OPEN SOURCE · ANY CI</text>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <path d="M596 236 H1222" stroke="#D3D8DF" stroke-width="2" stroke-linecap="round"/>
    <path d="M596 236 H698" stroke="#006FFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="616" cy="236" r="5" fill="#FFFFFF" stroke="#006FFF" stroke-width="2"/>
    <circle cx="652" cy="236" r="5" fill="#FFFFFF" stroke="#006FFF" stroke-width="2"/>

    <path d="M678 120 V216 Q678 236 698 236" stroke="#006FFF" stroke-width="2"/>
    <path d="M844 120 V216 Q844 236 864 236" stroke="#9FC6FF" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M1004 120 V178" stroke="#F4B4B6" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M1136 120 V216 Q1136 236 1156 236" stroke="#D3D8DF" stroke-width="2" stroke-dasharray="4 5"/>

    <g filter="url(#card)" fill="#FFFFFF" stroke="#E3E7EC">
      <rect x="616.5" y="84.5" width="123" height="35" rx="17.5"/>
      <rect x="754.5" y="84.5" width="179" height="35" rx="17.5"/>
      <rect x="948.5" y="84.5" width="111" height="35" rx="17.5"/>
      <rect x="1074.5" y="84.5" width="123" height="35" rx="17.5"/>
    </g>

    <circle cx="636" cy="102" r="5" fill="#006FFF"/>
    <text x="650" y="107" font-size="14" font-weight="600" fill="#14171C">#41</text>
    <text x="684" y="107" font-size="13" fill="#8A929C">merged</text>

    <text x="844" y="70" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle" fill="#9AA1AB">BATCH</text>
    <circle cx="774" cy="102" r="4" fill="#FFFFFF" stroke="#006FFF" stroke-width="2"/>
    <text x="788" y="107" font-size="14" font-weight="600" fill="#14171C">#42 + #43</text>
    <text x="866" y="107" font-size="13" fill="#8A929C">testing</text>

    <circle cx="968" cy="102" r="5" fill="#E5484D"/>
    <text x="982" y="107" font-size="14" font-weight="600" fill="#14171C">#44</text>
    <text x="1016" y="107" font-size="13" fill="#8A929C">failed</text>
    <circle cx="1004" cy="190" r="10" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
    <path d="M1000 186 L1008 194 M1008 186 L1000 194" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>

    <circle cx="1094" cy="102" r="4" fill="#FFFFFF" stroke="#C3C9D1" stroke-width="2"/>
    <text x="1108" y="107" font-size="14" font-weight="600" fill="#14171C">#45</text>
    <text x="1142" y="107" font-size="13" fill="#8A929C">waiting</text>

    <circle cx="1222" cy="236" r="12" fill="#006FFF"/>
    <path d="M1216.5 236.5 L1220.5 240.5 L1228 232.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="596" y="272" font-size="13" font-weight="500" letter-spacing="1" fill="#9AA1AB">MAIN</text>
  </g>
</svg>
