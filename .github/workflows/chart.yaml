# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Chart

# The chart jobs run on a pull request only when it changes what the chart
# installs, and once a night: a change of the code can break an installation
# without touching these paths (DECISIONS.md D256).
on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "scripts/smoke.sh"
      - "scripts/smoke/**"
      - "Dockerfile"
      - "migrations/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/chart.yaml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The jobs run on runners hosted by GitHub for now (DECISIONS.md D251): Smoke
# needs a Docker daemon, which cihub-runner does not have. They are not
# required statuses: CI stays the only one.
jobs:
  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

      - name: Check that the generated files of the chart are up to date
        run: mise run generate-check

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - name: Run helm unit tests
        run: mise run helm-unittest

  smoke:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Smoke
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      # Installs the chart with two replicas in a kind cluster, against a
      # CloudNativePG Postgres, then checks the migrations, the readiness,
      # helm test and a signed delivery.
      - name: Run smoke test
        run: mise run smoke
