# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The jobs run on cihub-runner, a self-hosted runner set in Kubernetes mode,
# without a Docker daemon, on a small machine. The image of the runner cannot
# link Rust (no C library headers), so the Rust checks run in the rust image,
# in one job: the unit tests and the tests against Postgres share one build.
jobs:
  rust:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust
    runs-on: cihub-runner
    container:
      image: rust:1.98.1-trixie@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    # Postgres runs in the pod of the job, on 127.0.0.1 as in compose.yaml.
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_PASSWORD: postgres
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Run linters
        run: mise run lint

      - name: Run unit tests
        run: mise run test

      - name: Setup Postgres
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends postgresql-client
          timeout 60 sh -c 'until pg_isready --quiet; do sleep 1; done'
          psql --quiet --set ON_ERROR_STOP=1 --file postgres-setup.sql

      - name: Run tests against Postgres
        run: mise run --skip-deps test-integration

      - name: Check coverage of the pure crates
        run: mise run cover

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: cihub-runner
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Lint workflows
        run: mise run lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - rust
      - workflow-lint
    runs-on: cihub-runner
    permissions: {}
    steps:
      # cancelled counts as failed: a required job that never reached a
      # verdict must not clear the merge gate.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped"
