# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The pod of a job is new for each run: incremental state and full debug
# information are work that no one reads.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The job runs on cihub-runner, a self-hosted runner set in Kubernetes mode,
# without a Docker daemon. The image of the runner cannot link Rust (no C
# library headers), so the job runs in the rust image. One job, because the
# two runners share one node: two builds at once each take twice as long
# (DECISIONS.md D242).
jobs:
  build:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Build Success
    runs-on: cihub-runner
    container:
      image: rust:1.98.1-trixie@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
    # Postgres runs in the pod of the job, on 127.0.0.1 as in compose.yaml.
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_PASSWORD: postgres
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Run linters
        run: mise run lint

      - name: Lint workflows
        run: mise run lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Postgres
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends postgresql-client
          timeout 60 sh -c 'until pg_isready --quiet; do sleep 1; done'
          psql --quiet --set ON_ERROR_STOP=1 --file postgres-setup.sql

      # nextest builds every test binary of the workspace, then filters: the
      # tests against Postgres reuse the build of the unit tests.
      - name: Run unit tests
        run: mise run test

      - name: Run tests against Postgres
        run: mise run --skip-deps test-integration
        env:
          # The tests share one Postgres and the node runs other workloads.
          NEXTEST_TEST_THREADS: "4"

      - name: Check coverage of the pure crates
        run: mise run cover
