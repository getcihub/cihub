# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  affected:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Affected
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      crates: ${{ steps.affected.outputs.crates }}
      core: ${{ steps.affected.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Select the affected crates
        id: affected
        run: mise run --quiet affected >> "$GITHUB_OUTPUT"
        env:
          NX_BASE: >-
            ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha }}

  rust-lint:
    needs: affected
    if: ${{ needs.affected.outputs.crates != '' }}
    name: Rust Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Run linters
        run: mise run lint
        env:
          CRATES: ${{ needs.affected.outputs.crates }}

  rust-test:
    needs: affected
    if: ${{ needs.affected.outputs.crates != '' }}
    name: Rust Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Run unit tests
        run: mise run test
        env:
          CRATES: ${{ needs.affected.outputs.crates }}

  rust-test-integration:
    needs: affected
    if: ${{ needs.affected.outputs.crates != '' }}
    name: Rust Integration Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Run tests against Postgres
        run: mise run test-integration
        env:
          CRATES: ${{ needs.affected.outputs.crates }}

  rust-cover:
    needs: affected
    if: ${{ needs.affected.outputs.core == 'true' }}
    name: Rust Coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Check coverage of the pure crates
        run: mise run cover

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked

      - name: Lint workflows
        run: mise run lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - affected
      - rust-lint
      - rust-test
      - rust-test-integration
      - rust-cover
      - workflow-lint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped"
