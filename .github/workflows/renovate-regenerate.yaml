# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Regenerate

# A Renovate update of helm-docs or helm-schema changes what they generate, and
# helm:generate-check then fails. This job generates the files again and pushes
# them to the branch of the update.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  GENERATED: helm/cihub/README.md helm/cihub/values.schema.json

jobs:
  regenerate:
    if: >-
      ${{ startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Regenerate
    runs-on: ubuntu-26.04
    steps:
      # The token of the Renovate App, not GITHUB_TOKEN: a push with
      # GITHUB_TOKEN does not start the CI of the new commit.
      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ secrets.RENOVATE_CLIENT_ID }}"
          private-key: "${{ secrets.RENOVATE_APP_PRIVATE_KEY }}"
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          install_args: --locked helm-docs aqua:dadav/helm-schema

      - name: Generate
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run helm:generate

      # .renovaterc.json5 lists this author in gitIgnoredAuthors, so that
      # Renovate keeps updating the branch.
      - name: Push
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # shellcheck disable=SC2086
          if git diff --quiet -- $GENERATED; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git commit -m "chore(helm): generate the README and the values schema" -- $GENERATED
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
