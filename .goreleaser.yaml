version: 2
project_name: cihub
before:
  hooks:
    - go mod tidy
builds:
  - id: cihub-agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: ./cmd/cihub-agent
    binary: cihub-agent
    ldflags: |
      -s -w
      -X github.com/getcihub/cihub/version.GitCommit={{ .Commit }}
  - id: cihub-server
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: ./cmd/cihub-server
    binary: cihub-server
    ldflags: |
      -s -w
      -X github.com/getcihub/cihub/version.GitCommit={{ .Commit }}
archives:
  - id: agent-archive
    ids:
      - cihub-agent
    formats:
      - "tar.gz"
    name_template: '{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
  - id: server-archive
    ids:
      - cihub-server
    formats:
      - "tar.gz"
    name_template: '{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
checksum:
  name_template: 'checksums-{{ .Version }}.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs?:'
      - '^chore:'
release:
  github:
    owner: getcihub
    name: cihub
  draft: false
  prerelease: auto
dockers:
  - id: server-amd64
    ids: [cihub-server]
    dockerfile: ./Dockerfile
    image_templates:
      - ghcr.io/getcihub/cihub-server:latest-amd64
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-amd64
    goarch: amd64
    goos: linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title=cihub-server"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
  - id: server-arm64
    ids: [cihub-server]
    dockerfile: ./Dockerfile
    image_templates:
      - ghcr.io/getcihub/cihub-server:latest-arm64
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-arm64
    goarch: arm64
    goos: linux
    build_flag_templates:
      - "--label=org.opencontainers.image.title=cihub-server"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

docker_manifests:
  - name_template: ghcr.io/getcihub/cihub-server:latest
    image_templates:
      - ghcr.io/getcihub/cihub-server:latest-amd64
      - ghcr.io/getcihub/cihub-server:latest-arm64
  - name_template: ghcr.io/getcihub/cihub-server:{{ .Version }}
    image_templates:
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-amd64
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-arm64
