version: 2
project_name: cihub
env:
  - GO111MODULE=on
builds:
  - id: cihub-server
    binary: cihub-server
    main: ./cmd/cihub-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "version.GitCommit={{ .FullCommit }}"
  - id: cihub-agent
    binary: cihub-agent
    main: ./cmd/cihub-agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "version.GitCommit={{ .FullCommit }}"
archives:
  - formats: [ 'tar.gz' ]
    name_template: "cihub-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
