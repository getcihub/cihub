version: 2
project_name: cihub
before:
  hooks:
    - go mod tidy
builds:
  - id: cihub-agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: ./cmd/cihub-agent
    binary: cihub-agent
    ldflags: |
      -s -w
      -X github.com/getcihub/cihub/version.GitCommit={{ .Commit }}
  - id: cihub-server
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: ./cmd/cihub-server
    binary: cihub-server
    ldflags: |
      -s -w
      -X github.com/getcihub/cihub/version.GitCommit={{ .Commit }}
archives:
  - id: agent-archive
    ids:
      - cihub-agent
    formats:
      - "tar.gz"
    name_template: '{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
  - id: server-archive
    ids:
      - cihub-server
    formats:
      - "tar.gz"
    name_template: '{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
checksum:
  name_template: 'checksums-{{ .Version }}.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs?:'
      - '^chore:'
release:
  github:
    owner: getcihub
    name: cihub
  draft: false
  prerelease: auto
dockers_v2:
  - id: server
    ids: [cihub-server]
    dockerfile: ./Dockerfile
    images:
      - ghcr.io/getcihub/cihub-server
    tags:
      - "latest"
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: cihub-server
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
docker_manifests:
  - name_template: ghcr.io/getcihub/cihub-server:latest
    image_templates:
      - ghcr.io/getcihub/cihub-server:latest-amd64
      - ghcr.io/getcihub/cihub-server:latest-arm64
  - name_template: ghcr.io/getcihub/cihub-server:{{ .Version }}
    image_templates:
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-amd64
      - ghcr.io/getcihub/cihub-server:{{ .Version }}-arm64
