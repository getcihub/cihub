# Git hooks (DECISIONS.md D166). `mise install` runs `lefthook install`.
[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-rust]
glob = ["*.rs"]
run = "cargo fmt --all"
stage_fixed = true

[pre-commit.commands.mise-lock]
glob = ["mise.toml"]
run = "mise lock -p linux-x64,linux-arm64,macos-arm64 && git add mise.lock"

[pre-commit.commands.actionlint]
glob = [".github/workflows/*.yaml", ".github/workflows/*.yml"]
run = "actionlint {staged_files}"

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/workflows/*.yml"]
run = "zizmor --offline {staged_files}"

[pre-push]
[pre-push.commands.lint]
run = "mise run lint"
