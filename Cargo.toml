[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/getcihub/cihub"
publish = false

[workspace.dependencies]
cihub-api-types = { path = "crates/api-types" }
cihub-cli = { path = "crates/cli" }
cihub-client = { path = "crates/client" }
cihub-conditions = { path = "crates/conditions" }
cihub-config = { path = "crates/config" }
cihub-domain = { path = "crates/domain" }
cihub-mergequeue = { path = "crates/mergequeue" }
cihub-mq-core = { path = "crates/mq-core" }
cihub-platform = { path = "crates/platform" }
cihub-scm = { path = "crates/scm" }
cihub-github = { path = "crates/github" }
cihub-web = { path = "crates/web" }
cihub-store = { path = "crates/store" }
cihub-telemetry = { path = "crates/telemetry" }
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false }
globset = { version = "0.4.20", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = { version = "0.17.14", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false }
ulid = "3.0.0"
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The binaries of the image (docs/DEPLOYMENT.md).
[profile.release]
lto = "thin"
codegen-units = 1
