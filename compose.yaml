# Development only: Postgres for local work and integration tests.
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: cihub
      POSTGRES_PASSWORD: cihub
      POSTGRES_DB: cihub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=cihub", "--dbname=cihub"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
