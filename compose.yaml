# Development only (specs/DEPLOYMENT.md): the credentials are fixed for local
# use, never use them elsewhere. Production installs with the Helm chart
# (helm/cihub). The configuration files of the services are in .docker/.
#
# Usage:
#   mise run db:start                                 # Postgres, then create or update the cihub role
#   mise run db:reset                                 # delete the data, then mise run db:start
#   mise run server:up                                # cihub-server from the local Dockerfile
#   mise run up                                       # the server and observability profiles together
#   docker compose --profile observability up -d      # Prometheus, Loki, Alloy, Grafana on http://127.0.0.1:3000
#   docker compose --profile "*" down                 # stop everything, keep the data
#
# postgres/postgres is the superuser. cihub-server connects as cihub/cihub,
# which is neither superuser nor BYPASSRLS and can create the databases
# of #[sqlx::test].
#
# The server profile takes the variables of the test App from the
# environment, which mise fills from mise.local.toml, as for mise run dev.
# Compose reads every variable of this file, whatever the active profiles:
# a variable of the server profile has a `:-` default, never `:?`, so that
# Postgres starts without them. cihub-server stops at startup on a missing
# value (specs/LESSONS.md).

x-cihub: &cihub
  image: ${CIHUB_IMAGE:-cihub-server:local}
  build: .
  environment:
    CIHUB_DATABASE_URL: postgres://cihub:cihub@postgres:5432/cihub
    CIHUB_GITHUB_URL: ${CIHUB_GITHUB_URL:-https://github.com}
    CIHUB_GITHUB_APP_ID: ${CIHUB_GITHUB_APP_ID:-}
    CIHUB_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app
    CIHUB_GITHUB_WEBHOOK_SECRET: ${CIHUB_GITHUB_WEBHOOK_SECRET:-}
    # The sign-in to the dashboard: all four, or none.
    CIHUB_HTTP_PUBLIC_URL: ${CIHUB_HTTP_PUBLIC_URL:-}
    CIHUB_GITHUB_CLIENT_ID: ${CIHUB_GITHUB_CLIENT_ID:-}
    CIHUB_GITHUB_CLIENT_SECRET: ${CIHUB_GITHUB_CLIENT_SECRET:-}
    CIHUB_DATABASE_SECRET: ${CIHUB_DATABASE_SECRET:-}
    CIHUB_LOG_FILTER: ${CIHUB_LOG_FILTER:-info}
  secrets:
    - github-app
  profiles:
    - server

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: bring the cihub role and database to the wanted state. It runs
  # on every start, so a change to postgres-setup.sql applies without deleting
  # the data. The CI runs the same file.
  postgres-setup:
    image: postgres:17.5-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./.docker/postgres-setup.sql:/postgres-setup.sql:ro
    command: ["psql", "--quiet", "--set", "ON_ERROR_STOP=1", "--file", "/postgres-setup.sql"]
    restart: "no"

  cihub-migrate:
    <<: *cihub
    command: ["migrate"]
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    restart: "no"

  cihub-server:
    <<: *cihub
    depends_on:
      cihub-migrate:
        condition: service_completed_successfully
    ports:
      # The internal address (8081) stays inside the network of the compose
      # (specs/SECURITY.md): Prometheus reaches it there.
      - "127.0.0.1:${CIHUB_HTTP_PORT:-8080}:8080"
    # No healthcheck: the distroless image has no shell and no HTTP client.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./.docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    profiles:
      - observability

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./.docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    # No healthcheck: the image has no shell, no HTTP client and no health
    # command.
    profiles:
      - observability

  # Sends the logs of the containers of this compose project to Loki.
  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./.docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image has neither wget nor curl: bash sends the request.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      - loki
    profiles:
      - observability

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Local only: anyone who reaches 127.0.0.1:3000 is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./.docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
      - loki
    profiles:
      - observability

secrets:
  github-app:
    # The private key of the GitHub App (.pem), at the path that mise run dev
    # reads. The user of the image (uid 65532) must be able to read it.
    file: ${CIHUB_GITHUB_PRIVATE_KEY_FILE:-./github-app.private-key.pem}

volumes:
  postgres:
  prometheus:
  loki:
  grafana:
