# Development only (specs/DEPLOYMENT.md): the credentials are fixed for local
# use, never use them elsewhere. Production installs with the Helm chart
# (helm/cihub). The configuration files of the services are in .docker/.
#
# Usage:
#   mise run db:start                                 # Postgres, then create or update the cihub role
#   mise run db:reset                                 # delete the data, then mise run db:start
#   mise run server:up                                # cihub-server from the local Dockerfile
#   mise run up                                       # the server and observability profiles together
#   docker compose --profile observability up -d      # Prometheus, Loki, Alloy, Grafana on http://127.0.0.1:3000
#   docker compose --profile tunnel up -d             # cloudflared, to receive the webhooks of the App
#   docker compose --profile "*" down                 # stop everything, keep the data
#
# mise run dev starts the services of the profiles in COMPOSE_PROFILES:
# COMPOSE_PROFILES = "tunnel" in mise.local.toml starts the tunnel with it.
#
# postgres/postgres is the superuser. cihub-server connects as cihub/cihub,
# which is neither superuser nor BYPASSRLS and can create the databases
# of #[sqlx::test].
#
# The server profile takes the variables of the test App from the
# environment, which mise fills from mise.local.toml, as for mise run dev.
# Compose reads every variable of this file, whatever the active profiles:
# a variable of the server profile has a `:-` default, never `:?`, so that
# Postgres starts without them. cihub-server stops at startup on a missing
# value (specs/LESSONS.md).
name: cihub
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 3s
  retries: 5
  start_period: 30s
  start_interval: 1s

x-cihub: &cihub
  image: ${CIHUB_IMAGE:-cihub-server:local}
  build: .
  environment:
    CIHUB_DATABASE_SECRET: ${CIHUB_DATABASE_SECRET:-}
    CIHUB_DATABASE_URL: postgres://cihub:cihub@postgres:5432/cihub
    CIHUB_GITHUB_APP_ID: ${CIHUB_GITHUB_APP_ID:-}
    CIHUB_GITHUB_CLIENT_ID: ${CIHUB_GITHUB_CLIENT_ID:-}
    CIHUB_GITHUB_CLIENT_SECRET: ${CIHUB_GITHUB_CLIENT_SECRET:-}
    CIHUB_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app
    CIHUB_GITHUB_URL: ${CIHUB_GITHUB_URL:-https://github.com}
    CIHUB_GITHUB_WEBHOOK_SECRET: ${CIHUB_GITHUB_WEBHOOK_SECRET:-}
    CIHUB_HTTP_PUBLIC_URL: ${CIHUB_HTTP_PUBLIC_URL:-}
    CIHUB_LOG_FILTER: ${CIHUB_LOG_FILTER:-info}
  secrets:
    - github-app
  profiles:
    - server

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]

  postgres-setup:
    image: ghcr.io/home-operations/postgres-init:18.6
    environment:
      INIT_POSTGRES_HOST: postgres
      INIT_POSTGRES_SUPER_PASS: postgres
      INIT_POSTGRES_USER: cihub
      INIT_POSTGRES_PASS: cihub
      INIT_POSTGRES_DBNAME: cihub
      INIT_POSTGRES_USER_FLAGS: "--createdb --login --no-superuser"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cihub-migrate:
    <<: *cihub
    command: ["migrate", "up"]
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    restart: "no"

  cihub-server:
    <<: *cihub
    depends_on:
      cihub-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CIHUB_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_URL: http://host.docker.internal:8080
      TUNNEL_METRICS: 127.0.0.1:2000
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "cloudflared", "tunnel", "ready"]
    restart: unless-stopped
    profiles:
      - tunnel

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus:/prometheus
      - type: bind
        read_only: true
        source: ./.docker/observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
    profiles:
      - observability

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - loki:/loki
      - type: bind
        read_only: true
        source: ./.docker/observability/loki.yaml
        target: /etc/loki/loki.yaml
    profiles:
      - observability

  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        read_only: true
        source: ./.docker/observability/config.alloy
        target: /etc/alloy/config.alloy
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
    depends_on:
      loki:
        condition: service_started
    profiles:
      - observability

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - type: bind
        read_only: true
        source: ./.docker/observability/grafana/provisioning
        target: /etc/grafana/provisioning
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    profiles:
      - observability

secrets:
  github-app:
    file: ${CIHUB_GITHUB_PRIVATE_KEY_FILE:-./github-app.private-key.pem}

volumes:
  postgres:
  prometheus:
  loki:
  grafana:
