# Development only: Postgres 17 for local work and the
# integration tests. The credentials are fixed for local use: never use them
# elsewhere.
#
# Usage:
#   mise run db          # start Postgres, then create or update the cihub role
#   mise run db:reset    # delete the data, then mise run db
#   docker compose down  # stop Postgres, keep the data
#
# postgres/postgres is the superuser. cihub-server connects as cihub/cihub,
# which is neither superuser nor BYPASSRLS and can create the databases
# of #[sqlx::test].

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: bring the cihub role and database to the wanted state. It runs
  # on every start, so a change to postgres-setup.sql applies without deleting
  # the data. The CI runs the same file.
  postgres-setup:
    image: postgres:17.5-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./postgres-setup.sql:/postgres-setup.sql:ro
    command: ["psql", "--quiet", "--set", "ON_ERROR_STOP=1", "--file", "/postgres-setup.sql"]
    restart: "no"

volumes:
  postgres:
