[package]
name = "cihub-cli"
description = "cihub: the binary of CIHub, its server and its command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cihub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
cihub-api-types.workspace = true
cihub-client.workspace = true
cihub-domain.workspace = true
cihub-github.workspace = true
cihub-mergequeue.workspace = true
cihub-web.workspace = true
cihub-platform.workspace = true
cihub-scm.workspace = true
cihub-store.workspace = true
cihub-telemetry.workspace = true
clap.workspace = true
secrecy.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Serves the dashboard on the public address (DECISIONS.md D174).
dashboard = ["cihub-web/dashboard"]

[dev-dependencies]
ring.workspace = true
sqlx.workspace = true

[lints]
workspace = true
