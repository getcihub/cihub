[package]
name = "cihub-cli"
description = "cihub: the command line of CIHub, which talks to an instance through the public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cihub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cihub-api-types.workspace = true
cihub-client.workspace = true
cihub-domain.workspace = true
cihub-github.workspace = true
clap.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
