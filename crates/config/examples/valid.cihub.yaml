version: 1
queues:
  - name: main
    branch: main
    strategy: batched
    queue_conditions:
      - github-review-decision = approved
      - -draft
      - -label = do-not-merge
    merge_conditions:
      - check-success = build
    batching: { size: 6 }
  - name: hotfix
    branch: main
    strategy: sequential
    merge_method: fast_forward
    queue_conditions:
      - label = hotfix
priority_rules:
  - name: dependabot
    conditions:
      - author = dependabot[bot]
    priority: low
defaults:
  testing_timeout_minutes: 120
  label_commands: { enqueue_label: ready-to-merge }
