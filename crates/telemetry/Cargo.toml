[package]
name = "cihub-telemetry"
description = "CIHub telemetry: logs and error reports, then traces and metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `CapturedLogs`, for the tests of other crates.
capture = []

[dependencies]
rustls.workspace = true
sentry.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "json", "std", "time"] }

[lints]
workspace = true
