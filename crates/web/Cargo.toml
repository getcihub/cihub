[package]
name = "cihub-web"
description = "CIHub HTTP server of the web role: the webhooks of the SCM, then the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
cihub-api-types = { workspace = true, features = ["openapi"] }
cihub-domain.workspace = true
cihub-github.workspace = true
cihub-platform.workspace = true
cihub-scm.workspace = true
cihub-store.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
cihub-scm = { workspace = true, features = ["sim"] }
cihub-telemetry = { workspace = true, features = ["capture"] }
ring.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
ulid.workspace = true

[lints]
workspace = true
