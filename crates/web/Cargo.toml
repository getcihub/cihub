[package]
name = "cihub-web"
description = "CIHub HTTP server of the web role: the webhooks of the SCM, then the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
cihub-api-types = { workspace = true, features = ["openapi"] }
cihub-domain.workspace = true
cihub-github.workspace = true
cihub-platform.workspace = true
cihub-store.workspace = true
rust-embed = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-util.workspace = true
tracing.workspace = true
utoipa.workspace = true

[features]
# The dashboard of web/, built before (`mise run web-build`; DECISIONS.md D174).
dashboard = ["dep:rust-embed"]

[dev-dependencies]
ring.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
ulid.workspace = true

[lints]
workspace = true
