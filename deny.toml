[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

# The root certificates of Mozilla, which rustls-platform-verifier embeds:
# a license for data, not for code.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The pure core crates (domain, conditions, config, contracts, mq-core,
# flaky-core) must not reach these crates. Each entry lists the
# only crates allowed to depend on it directly. When a new external crate
# needs one of them (for example hyper needs tokio), add it here.
deny = [
    { crate = "tokio", wrappers = [
        "cihub-scm",
        "cihub-github",
        "cihub-web",
        "cihub-platform",
        "cihub-mergequeue",
        "cihub-flakytests",
        "cihub-cli",
        "axum",
        "hyper",
        "hyper-rustls",
        "hyper-util",
        "reqwest",
        "sqlx-core",
        "sqlx-macros-core",
        "tokio-rustls",
        "tokio-stream",
        "tokio-util",
        "tower",
        # Only on wasm targets, which `all-features` brings into the graph.
        "wasm-bindgen-futures",
    ] },
    { crate = "sqlx", wrappers = [
        "cihub-store",
        # A dev-dependency only: its tests against Postgres.
        "cihub-web",
        "cihub-cli",
        "cihub-platform",
        "cihub-analytics",
        "cihub-mergequeue",
        "cihub-flakytests",
    ] },
    { crate = "reqwest", wrappers = [
        "cihub-github",
        "cihub-platform",
        "cihub-client",
    ] },
    { crate = "axum", wrappers = [
        # A dev-dependency only: the replay of recorded answers.
        "cihub-github",
        "cihub-platform",
        "cihub-web",
        "cihub-mergequeue",
        "cihub-flakytests",
        "cihub-cli",
    ] },
    # The pure crates write no logs: the caller writes their decisions.
    { crate = "tracing", wrappers = [
        "cihub-cli",
        "cihub-mergequeue",
        "cihub-platform",
        "cihub-telemetry",
        "cihub-web",
        "hyper-util",
        "sqlx-core",
        "sqlx-postgres",
        "tracing-subscriber",
    ] },
    # A library crate keeps the cause in its own `thiserror` enumeration.
    { crate = "anyhow", wrappers = ["cihub-cli"] },
    # Only the binary and the web server wire the adapter; the other crates see
    # the neutral `Scm` trait.
    { crate = "cihub-github", wrappers = [
        "cihub-cli",
        "cihub-web",
        # A dev-dependency only: the rate limit test, end to end.
        "cihub-mergequeue",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
