[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

# The root certificates of Mozilla, which rustls-platform-verifier embeds
# (AGENTS.md D81): a license for data, not for code.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The pure core crates (domain, conditions, config, contracts, mq-core,
# flaky-core) and the CLI must not reach these crates. Each entry lists the
# only crates allowed to depend on it directly. When a new external crate
# needs one of them (for example hyper needs tokio), add it here.
deny = [
    { crate = "tokio", wrappers = [
        "cihub-scm",
        "cihub-github",
        "cihub-platform",
        "cihub-mergequeue",
        "cihub-flakytests",
        "cihub-server",
        "cihub-cli",
        "axum",
        "hyper",
        "hyper-rustls",
        "hyper-util",
        "reqwest",
        "sqlx-core",
        "sqlx-macros-core",
        "tokio-rustls",
        "tokio-stream",
        "tokio-util",
        "tower",
        # Only on wasm targets, which `all-features` brings into the graph.
        "wasm-bindgen-futures",
    ] },
    { crate = "sqlx", wrappers = [
        "cihub-store",
        "cihub-server",
        "cihub-platform",
        "cihub-analytics",
        "cihub-mergequeue",
        "cihub-flakytests",
    ] },
    { crate = "reqwest", wrappers = [
        "cihub-github",
        "cihub-platform",
        "cihub-client",
    ] },
    { crate = "axum", wrappers = [
        "cihub-platform",
        "cihub-http",
        "cihub-mergequeue",
        "cihub-flakytests",
        "cihub-server",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
