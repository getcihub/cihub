suite: configmap
templates:
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: writes server.yaml without secrets
    set:
      github.url: https://github.example.com
      log.format: pretty
    asserts:
      - equal:
          path: data["server.yaml"]
          value: |
            database:
              connection_timeout: 30
              idle_timeout: 600
              pool_size: 10
            github:
              app_id: "123456"
              private_key_file: /etc/cihub/github/private-key.pem
              url: https://github.example.com
            http:
              addr: 0.0.0.0:8080
            internal:
              addr: 0.0.0.0:8081
            log:
              filter: info
              format: pretty
  - it: gives the address and the client of the sign-in when they are set
    set:
      publicUrl: https://ci.example.com
      github.clientId: Iv23li.client
    asserts:
      - equal:
          path: data["server.yaml"]
          value: |
            database:
              connection_timeout: 30
              idle_timeout: 600
              pool_size: 10
            github:
              app_id: "123456"
              client_id: Iv23li.client
              private_key_file: /etc/cihub/github/private-key.pem
              url: https://github.com
            http:
              addr: 0.0.0.0:8080
              public_url: https://ci.example.com
            internal:
              addr: 0.0.0.0:8081
            log:
              filter: info
              format: json
  - it: gives the number of proxies that append to the address of the client
    set:
      trustedProxyHops: 1
    asserts:
      - equal:
          path: data["server.yaml"]
          value: |
            database:
              connection_timeout: 30
              idle_timeout: 600
              pool_size: 10
            github:
              app_id: "123456"
              private_key_file: /etc/cihub/github/private-key.pem
              url: https://github.com
            http:
              addr: 0.0.0.0:8080
              trusted_proxy_hops: 1
            internal:
              addr: 0.0.0.0:8081
            log:
              filter: info
              format: json
  - it: gives the settings of the pool
    set:
      database.poolSize: 25
      database.idleTimeout: 120
      database.connectionTimeout: 5
    asserts:
      - equal:
          path: data["server.yaml"]
          value: |
            database:
              connection_timeout: 5
              idle_timeout: 120
              pool_size: 25
            github:
              app_id: "123456"
              private_key_file: /etc/cihub/github/private-key.pem
              url: https://github.com
            http:
              addr: 0.0.0.0:8080
            internal:
              addr: 0.0.0.0:8081
            log:
              filter: info
              format: json

  - it: leaves the rollout to the checksum of the pods, not to Reloader
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/ignore"]
          value: "true"
