suite: deployment
templates:
  - deployment.tpl
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: starts the four roles with the file of the ConfigMap
    template: deployment.tpl
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].args
          value: [start, --config, /etc/cihub/server.yaml]
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-cihub

  - it: takes the secrets from their Secrets
    template: deployment.tpl
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_DATABASE_URL
            valueFrom:
              secretKeyRef: { name: cihub-postgres, key: uri }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_GITHUB_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef: { name: cihub-github, key: webhook-secret }
      - equal:
          path: spec.template.spec.volumes[1].secret
          value:
            secretName: cihub-github
            items:
              - key: private-key.pem
                path: private-key.pem

  - it: takes the client secret of the sign-in and the database secret only with a client ID
    template: deployment.tpl
    set:
      github.clientId: Iv23li.client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_GITHUB_CLIENT_SECRET
            valueFrom:
              secretKeyRef: { name: cihub-github, key: client-secret }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_DATABASE_SECRET
            valueFrom:
              secretKeyRef: { name: cihub-postgres, key: secret }

  - it: takes the database secret from its own Secret when one is named
    template: deployment.tpl
    set:
      github.clientId: Iv23li.client
      database.existingSecret: cihub-postgres-app
      database.secretExistingSecret: cihub-sealing
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_DATABASE_URL
            valueFrom:
              secretKeyRef: { name: cihub-postgres-app, key: uri }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_DATABASE_SECRET
            valueFrom:
              secretKeyRef: { name: cihub-sealing, key: secret }

  - it: has no client secret and no database secret without a client ID
    template: deployment.tpl
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_GITHUB_CLIENT_SECRET
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIHUB_DATABASE_SECRET
          any: true

  - it: probes the internal address
    template: deployment.tpl
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value: { path: /healthz, port: internal }
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: { path: /readyz, port: internal }

  - it: mounts no ServiceAccount token
    template: deployment.tpl
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: rolls the pods when server.yaml changes
    template: deployment.tpl
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: pins the image by its digest
    template: deployment.tpl
    set:
      image.digest: sha256:0123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/getcihub/server@sha256:0123

  - it: defaults the tag to the appVersion
    template: deployment.tpl
    chart:
      appVersion: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/getcihub/server:1.2.3

  - it: refuses a missing database Secret
    template: deployment.tpl
    set:
      database.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: database.existingSecret is required

  - it: refuses a missing App ID
    template: deployment.tpl
    set:
      github.appId: ""
    asserts:
      - failedTemplate:
          errorPattern: github.appId is required

  - it: refuses a missing GitHub Secret
    template: deployment.tpl
    set:
      github.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: github.existingSecret is required

  - it: runs under the restricted Pod Security profile
    template: deployment.tpl
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  - it: spreads the server pods over the nodes, with the labels of the release
    template: deployment.tpl
    release:
      name: ci
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cihub
                  app.kubernetes.io/instance: ci
                  app.kubernetes.io/component: server

  - it: refuses an unknown key
    template: deployment.tpl
    set:
      database.existingsecret: cihub-postgres
    asserts:
      - failedTemplate:
          errorPattern: existingsecret

  - it: refuses an unknown log format
    template: deployment.tpl
    set:
      log.format: text
    asserts:
      - failedTemplate:
          errorPattern: log.format
