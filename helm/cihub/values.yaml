---
# Default values of the cihub chart (specs/DEPLOYMENT.md).

# @schema.root
# additionalProperties: false
# @schema.root

# @schema
# type: object
# additionalProperties: false
# @schema
image:
  # -- Image repository.
  repository: ghcr.io/getcihub/server
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag; the appVersion of the chart when empty.
  tag: ""
  # -- Image digest (`sha256:…`); wins over the tag when set.
  digest: ""

# -- Secrets to pull the image, for the server pods, the migration Job and the test pod.
imagePullSecrets: []
# -- Replaces the name of the chart in the names of the resources.
nameOverride: ""
# -- Replaces the full name of the resources.
fullnameOverride: ""

# -- The root address where people reach the instance, such as `https://ci.example.com`. The sign-in to the dashboard sends them back there; without it, nobody signs in (specs/DEPLOYMENT.md).
publicUrl: ""

# -- Number of proxies in front of the server (an Ingress, a load balancer) that append to `X-Forwarded-For`; the sign-in routes that need no token are limited per client address, which the server reads in this header from the right. 0 takes the address of the connection, which is the address of the proxy behind a proxy, so that every client shares one limit (specs/SECURITY.md).
trustedProxyHops: 0

# -- Replicas of `cihub-server start`. Each replica runs the four roles (`web`, `scheduler`, `worker`, `notifier`), and the replicas share the work through Postgres; 2 keeps a replica that serves the webhooks while a pod or a node is lost.
replicas: 1

# -- Update strategy of the Deployment. A new pod is ready before an old one stops, so a replica always serves the webhooks; a published migration stays compatible with the previous version for this overlap (specs/DEPLOYMENT.md).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# @schema
# type: object
# additionalProperties: false
# @schema
log:
  # -- Log filter, `log.filter` of `server.yaml` (specs/OBSERVABILITY.md).
  filter: info
  # @schema
  # type: string
  # enum: [json, pretty]
  # @schema
  # -- Log format, `json` or `pretty`.
  format: json

# @schema
# type: object
# additionalProperties: false
# @schema
database:
  # -- (required) Secret that holds the URL of Postgres, `database.url` of `server.yaml`. The role is neither a superuser nor `BYPASSRLS` (CIHub refuses it at startup) and owns the database: the migration Job uses the same URL.
  existingSecret: ""
  # -- Key of the URL in that Secret.
  key: uri
  # -- Secret that holds `database.secret`, at least 32 bytes, which seals the tokens of the people who sign in; the Secret of the URL when empty, so that the URL can stay in a Secret that an operator writes, such as `<cluster>-app` of CloudNativePG. Read when `github.clientId` is set.
  secretExistingSecret: ""
  # -- Key of `database.secret` in its Secret.
  secretKey: secret
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Largest number of connections of each replica to Postgres; the sum over the replicas stays under the `max_connections` of Postgres.
  poolSize: 10
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Seconds after which an unused connection is closed.
  idleTimeout: 600
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Seconds that a query waits for a connection of the pool before it fails.
  connectionTimeout: 30

# @schema
# type: object
# additionalProperties: false
# @schema
github:
  # -- github.com, or the address of a GitHub Enterprise Server.
  url: https://github.com
  # @schema
  # type: [integer, string]
  # @schema
  # -- (required) Identifier of the GitHub App (specs/GITHUB.md).
  appId: ""
  # -- (required) Secret that holds the private key and the webhook secret of the App.
  existingSecret: ""
  # -- Key of the private key (PEM) in that Secret.
  privateKeyKey: private-key.pem
  # -- Key of the webhook secret in that Secret.
  webhookSecretKey: webhook-secret
  # -- Client ID of the App, for the sign-in to the dashboard; with it, the Secret also holds the client secret.
  clientId: ""
  # -- Key of the client secret of the App in that Secret, read when `clientId` is set.
  clientSecretKey: client-secret

# -- Annotations of the Deployment.
deploymentAnnotations: {}
# -- Annotations of the server pods.
podAnnotations: {}
# -- Labels of the server pods.
podLabels: {}

# -- Security context of the pods: the user of the image (65532), not root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Security context of the containers: CIHub writes no file.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# @schema
# type: object
# additionalProperties: false
# @schema
service:
  # -- Type of the Service.
  type: ClusterIP
  # -- Port of the Service, to the public address of the pods: the webhooks on `POST /webhooks/github` and the API. The internal address (`/healthz`, `/readyz`) stays on the pods, for the probes.
  port: 8080

# One Ingress, or one Gateway API HTTPRoute, to the Service. The webhook URL
# of the GitHub App is `https://<host>/webhooks/github`.
# @schema
# type: object
# additionalProperties: false
# @schema
ingress:
  # -- Expose the Service through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Annotations of the Ingress.
  annotations: {}
  # -- Hosts of the Ingress and their paths.
  hosts:
    - host: cihub.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration of the Ingress.
  tls: []

# @schema
# type: object
# additionalProperties: false
# @schema
httpRoute:
  # -- Expose the Service through a Gateway API HTTPRoute, instead of an Ingress.
  enabled: false
  # -- Annotations of the HTTPRoute.
  annotations: {}
  # -- Labels of the HTTPRoute.
  labels: {}
  # -- Gateways and listeners of the route.
  parentRefs: []
  # -- Host names of the route.
  hostnames: []
  # -- Match conditions of the rule.
  matches:
    - path:
        type: PathPrefix
        value: /

# -- Resources of the server pods and of the migration Job.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Liveness probe: `/healthz` answers as long as the process runs.
livenessProbe:
  httpGet:
    path: /healthz
    port: internal
  periodSeconds: 20
# -- Readiness probe: `/readyz` answers 503 when Postgres does not answer within 2 s.
readinessProbe:
  httpGet:
    path: /readyz
    port: internal
  periodSeconds: 10
# -- Startup probe; the other probes wait until it passes. It allows a minute.
startupProbe:
  httpGet:
    path: /healthz
    port: internal
  periodSeconds: 2
  failureThreshold: 30

# @schema
# type: object
# additionalProperties: false
# @schema
podDisruptionBudget:
  # -- Create a PodDisruptionBudget when there is more than one replica.
  enabled: true
  # @schema
  # type: [integer, string]
  # @schema
  # -- Pods that must stay available, as a count or a percentage; used when `maxUnavailable` is empty.
  minAvailable: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Pods that may be unavailable, as a count or a percentage; wins over `minAvailable`.
  maxUnavailable: 1

# -- Priority class of the server pods.
priorityClassName: ""
# -- Node selector of the pods.
nodeSelector: {}
# -- Tolerations of the pods.
tolerations: []
# -- Affinity of the pods.
affinity: {}
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Topology spread constraints of the server pods, rendered through `tpl`. By default, the replicas go to different nodes when the cluster can do it, so that the loss of a node keeps a replica that serves the webhooks.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "cihub.name" . }}'
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: server

# @schema
# type: object
# additionalProperties: false
# @schema
tests:
  # @schema
  # type: object
  # additionalProperties: false
  # @schema
  image:
    # -- Image of the `helm test` pod, from the mirror of Google, which does not limit the pulls as Docker Hub does.
    repository: mirror.gcr.io/curlimages/curl
    # -- Tag of that image, followed by its digest, so that Renovate updates both together.
    tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"
    # -- Pull policy of that image.
    pullPolicy: IfNotPresent
