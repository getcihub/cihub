[tools]
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-nextest" = "0.9.146"
"actionlint" = "1.7.12"
"rust" = { version = "1.98.1", profile = "minimal", components = "clippy,rustfmt,llvm-tools" }
"zizmor" = "1.30.1"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting, clippy lints and dependency rules"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
]

[tasks.test]
description = "Run the unit tests"
run = "cargo nextest run --workspace --no-tests=pass"

[tasks.lint-workflows]
description = "Lint the GitHub workflows with actionlint and zizmor"
run = ["actionlint", "zizmor .github/workflows"]

[tasks.cover]
description = "Check the line coverage of the pure crates (90 % or more)"
run = "cargo llvm-cov nextest -p cihub-domain -p cihub-conditions -p cihub-config --fail-under-lines 90"

[tasks.check]
description = "Run lint, then test"
run = ["mise run lint", "mise run test"]

[tasks.db]
description = "Start the development Postgres of compose.yaml"
run = "docker compose up --detach --wait"
