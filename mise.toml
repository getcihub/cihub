[tools]
"actionlint" = "1.7.12"
"aqua:dadav/helm-schema" = "0.23.5"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cosign" = "3.1.4"
"helm-docs" = "1.14.2"
"helm" = "4.3.0"
"kind" = "0.33.0"
"kubectl" = "1.37.1"
"lefthook" = "2.2.1"
# pnpm before node: the corepack of node gives a pnpm of its own.
"pnpm" = "12.11.2"
"node" = "24.21.0"
"rust" = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools" }
"shellcheck" = "0.11.0"
"zizmor" = "1.30.1"

[hooks]
postinstall = "lefthook install"

# The development Postgres of compose.yaml: the tests use
# DATABASE_URL, cihub-server uses CIHUB_DATABASE_URL.
[env]
DATABASE_URL = "postgres://cihub:cihub@127.0.0.1:5432/cihub"
CIHUB_DATABASE_URL = "{{env.DATABASE_URL}}"

[vars]
helm_lint_values = "helm/cihub/ci/lint-values.yaml"

[tasks.fmt]
description = "Format the Rust code, the console, the website and @cihub/ui"
depends = ["rust:fmt", "console:fmt", "website:fmt", "ui:fmt"]

[tasks.lint]
description = "Lint the Rust code, the console, the website and @cihub/ui"
depends = ["rust:lint", "console:lint", "website:lint", "ui:lint"]

[tasks.test]
description = "Run the unit tests of the Rust code, of the console and of @cihub/ui"
depends = ["rust:test", "console:test", "ui:test"]

[tasks."test:all"]
description = "Run every test suite: unit, integration, browser and website"
depends = ["rust:test", "rust:integration", "console:test", "ui:test", "console:e2e", "website:test"]

[tasks.check]
description = "Run lint, then test"
run = [{ task = "lint" }, { task = "test" }]

[tasks.generate]
description = "Generate the files of the console and of the chart"
depends = ["console:generate", "helm:generate"]

[tasks."rust:fmt"]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks."rust:lint"]
description = "Check formatting, clippy lints, dependency rules and the rules of AGENTS.md"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
  "scripts/lint-rules.sh",
]

[tasks."rust:build"]
description = "Build the console, then the cihub-server binary in release mode"
depends = ["console:build"]
run = "cargo build --release --locked -p cihub-server"

[tasks."rust:test"]
description = "Run the unit tests"
run = "cargo nextest run --workspace --no-tests=pass --profile rust-unit -E 'not binary(postgres)'"

[tasks."rust:integration"]
description = "Run the tests against Postgres (the tests/postgres.rs files)"
depends = ["db:start"]
run = "cargo nextest run --workspace --no-tests=pass --profile rust-integration -E 'binary(postgres)'"

[tasks."rust:sim"]
description = "Run the fault injection tests, default and batched, on 1 000 seeds"
depends = ["db:start"]
env = { CIHUB_SIM_SEEDS = "1000" }
run = "cargo nextest run -p cihub-mergequeue -E 'binary(postgres) and test(fault_injection)'"

[tasks."rust:load"]
description = "Compare batched and pipelined on the simulated load, and count the useless assemblies"
run = "cargo nextest run -p cihub-mq-core -E 'binary(load)' --run-ignored only"

[tasks."rust:cover"]
description = "Check the line coverage of the pure crates (90 % or more)"
run = "cargo llvm-cov nextest -p cihub-domain -p cihub-conditions -p cihub-config -p cihub-mq-core --fail-under-lines 90"

[tasks."db:start"]
description = "Start the development Postgres of compose.yaml, then create or update the cihub role"
run = [
  "docker compose up --detach --wait postgres",
  "docker compose run --rm postgres-setup",
]

[tasks."db:reset"]
description = "Delete the data of the development Postgres, then start it again"
run = ["docker compose down --volumes", { task = "db:start" }]

[tasks."db:migrate"]
description = "Apply the migrations to the development Postgres"
depends = ["db:start"]
env = { CIHUB_LOG_FORMAT = "pretty" }
run = "cargo run --quiet -p cihub-server -- migrate up"

[tasks.dev]
description = "Start Postgres and the profiles of COMPOSE_PROFILES, apply the migrations, then run cihub-server start with the four roles"
depends = ["db:migrate"]
env = { CIHUB_LOG_FORMAT = "pretty" }
run = ["docker compose up --detach", "cargo run --quiet -p cihub-server -- start"]

[tasks."server:up"]
description = "Build the image, then start Postgres, the migrations and cihub-server in compose.yaml (profile server), with the profiles of COMPOSE_PROFILES"
run = 'COMPOSE_PROFILES="server${COMPOSE_PROFILES:+,$COMPOSE_PROFILES}" docker compose up --detach --wait --build'

[tasks.up]
description = "Build the image, then start Postgres, cihub-server, the observability stack and the profiles of COMPOSE_PROFILES"
run = 'COMPOSE_PROFILES="server,observability${COMPOSE_PROFILES:+,$COMPOSE_PROFILES}" docker compose up --detach --wait --build'

[tasks."pnpm:install"]
description = "Install the dependencies of the console, the website and @cihub/ui, as pnpm-lock.yaml gives them"
run = "pnpm install --frozen-lockfile"

[tasks."console:fmt"]
description = "Format the console with oxfmt, its TypeScript, CSS, JSON and Markdown"
depends = ["pnpm:install"]
dir = "apps/console"
run = "pnpm format"

[tasks."console:lint"]
description = "Type check, lint and check the format of the console"
depends = ["pnpm:install"]
dir = "apps/console"
run = "pnpm lint"

[tasks."console:test"]
description = "Run the unit tests of the console"
depends = ["pnpm:install"]
dir = "apps/console"
run = "pnpm test"

[tasks."console:build"]
description = "Build the console into apps/console/dist, which the next build of cihub-web embeds"
depends = ["pnpm:install"]
dir = "apps/console"
run = "pnpm build"

[tasks."console:dev"]
description = "Serve the console with Vite, in front of a cihub-server start on CIHUB_URL (http://localhost:8080)"
depends = ["pnpm:install"]
dir = "apps/console"
run = "pnpm dev"

[tasks."console:e2e"]
description = "Run the browser tests of the console against a server on the simulator (needs Postgres)"
depends = ["db:start", "console:build"]
dir = "apps/console"
run = ["pnpm exec playwright install chromium", "pnpm e2e"]

[tasks."console:shots"]
description = "Capture the views of the console, with a mocked API, into test-reports/console-visual/head"
depends = ["pnpm:install"]
run = "apps/console/e2e/visual/shots.sh"

[tasks."console:shots-diff"]
description = "Compare the views of the console with the ones of a git ref, into test-reports/console-visual/diff"
depends = ["pnpm:install"]
run = "apps/console/e2e/visual/shots.sh diff"

[tasks."console:generate"]
description = "Write the OpenAPI document of the API from the code, then the API client of the console"
depends = ["pnpm:install"]
dir = "apps/console"
run = ["cargo run --quiet -p cihub-server --example openapi > ../../schema/openapi/v1.json", "pnpm generate"]

[tasks."console:generate-check"]
description = "Fail if the OpenAPI document or the API client of the console are not up to date"
run = [
  { task = "console:generate" },
  "! git status --porcelain schema/openapi apps/console/src/client | grep .",
]

[tasks."website:fmt"]
description = "Format the website with oxfmt"
depends = ["pnpm:install"]
dir = "apps/website"
run = "pnpm format"

[tasks."website:lint"]
description = "Type check, lint and check the format of the website"
depends = ["pnpm:install"]
dir = "apps/website"
run = "pnpm lint"

[tasks."website:dev"]
description = "Serve the website with Next.js on http://localhost:3000"
depends = ["pnpm:install"]
dir = "apps/website"
run = "pnpm dev"

[tasks."website:build"]
description = "Build the website into apps/website/.next, with the schema and the OpenAPI document of the repository"
depends = ["pnpm:install"]
dir = "apps/website"
run = "pnpm build"

[tasks."website:test"]
description = "Check what an agent reads on the built website: llms.txt, the Markdown of each page, the published files"
depends = ["website:build"]
dir = "apps/website"
run = "pnpm test"

[tasks."ui:fmt"]
description = "Format @cihub/ui with oxfmt"
depends = ["pnpm:install"]
dir = "packages/ui"
run = "pnpm format"

[tasks."ui:test"]
description = "Run the unit tests of @cihub/ui"
depends = ["pnpm:install"]
dir = "packages/ui"
run = "pnpm test"

[tasks."ui:lint"]
description = "Type check, lint and check the format of @cihub/ui"
depends = ["pnpm:install"]
dir = "packages/ui"
run = "pnpm lint"

[tasks."helm:lint"]
description = "Lint the Helm chart"
run = "helm lint helm/cihub --values {{vars.helm_lint_values}}"

[tasks."helm:unittest"]
description = "Run the template tests of the Helm chart with helm-unittest"
# renovate: datasource=github-releases depName=helm-unittest/helm-unittest
env = { HELM_UNITTEST_VERSION = "1.2.1" }
run = [
  "helm plugin list | grep -q '^unittest' || helm plugin install https://github.com/helm-unittest/helm-unittest --version \"v$HELM_UNITTEST_VERSION\" --verify=false",
  "helm unittest helm/cihub",
]

[tasks."helm:template"]
description = "Render the Helm chart with the lint values"
run = "helm template cihub helm/cihub --values {{vars.helm_lint_values}}"

[tasks."helm:generate"]
description = "Generate the README.md and the values.schema.json of the chart from Chart.yaml and values.yaml"
run = [
  "helm-docs --chart-search-root=helm --log-level=warn",
  "helm-schema --chart-search-root helm/cihub --skip-auto-generation required,additionalProperties --append-newline",
]

[tasks."helm:generate-check"]
description = "Fail if the generated files of the chart are not up to date"
run = [
  { task = "helm:generate" },
  "! git status --porcelain helm/cihub/README.md helm/cihub/values.schema.json | grep .",
]

[tasks."workflows:lint"]
description = "Lint the GitHub workflows with actionlint and zizmor"
run = ["actionlint", "zizmor .github/workflows"]

[tasks."helm:smoke"]
description = "Install the chart with two replicas in a kind cluster against a CloudNativePG Postgres, then check it (needs docker)"
run = "scripts/smoke.sh"
