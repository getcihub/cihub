[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"actionlint" = "1.7.12"
"rust" = { version = "1.98.1", profile = "minimal", components = "clippy,rustfmt,llvm-tools" }
"zizmor" = "1.30.1"

# The development Postgres of compose.yaml (AGENTS.md D12): the tests use
# DATABASE_URL, cihub-server uses CIHUB_DATABASE_URL.
[env]
DATABASE_URL = "postgres://cihub:cihub@127.0.0.1:5432/cihub"
CIHUB_DATABASE_URL = "postgres://cihub:cihub@127.0.0.1:5432/cihub"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting, clippy lints and dependency rules"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
]

[tasks.test]
description = "Run the unit tests"
run = "cargo nextest run --workspace --no-tests=pass -E 'not binary(postgres)'"

[tasks.test-integration]
description = "Run the tests against Postgres (the tests/postgres.rs files)"
depends = ["db"]
run = "cargo nextest run --workspace --no-tests=pass -E 'binary(postgres)'"

[tasks.lint-workflows]
description = "Lint the GitHub workflows with actionlint and zizmor"
run = ["actionlint", "zizmor .github/workflows"]

[tasks.cover]
description = "Check the line coverage of the pure crates (90 % or more)"
run = "cargo llvm-cov nextest -p cihub-domain -p cihub-conditions -p cihub-config -p cihub-mq-core --fail-under-lines 90"

[tasks.check]
description = "Run lint, then test"
run = ["mise run lint", "mise run test"]

[tasks.db]
description = "Start the development Postgres of compose.yaml"
run = "docker compose up --detach --wait"

[tasks.migrate]
description = "Apply the migrations to the development Postgres"
depends = ["db"]
run = "cargo run --quiet -p cihub-server -- migrate"

[tasks.dev]
description = "Start Postgres, apply the migrations, then run cihub-server with the four roles"
depends = ["migrate"]
env = { CIHUB_LOG_FORMAT = "pretty" }
run = "cargo run --quiet -p cihub-server"
