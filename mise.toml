[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:dadav/helm-schema" = "0.23.5"
"actionlint" = "1.7.12"
"helm" = "4.3.0"
"helm-docs" = "1.14.2"
"kind" = "0.33.0"
"kubectl" = "1.37.1"
"lefthook" = "2.2.1"
# pnpm before node: the corepack of node gives a pnpm of its own.
"pnpm" = "12.11.2"
"node" = "24.21.0"
"rust" = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools" }
"shellcheck" = "0.11.0"
"zizmor" = "1.30.1"

# The development Postgres of compose.yaml: the tests use
# DATABASE_URL, cihub server uses CIHUB_DATABASE_URL.
[hooks]
postinstall = "lefthook install"

[env]
DATABASE_URL = "postgres://cihub:cihub@127.0.0.1:5432/cihub"
CIHUB_DATABASE_URL = "postgres://cihub:cihub@127.0.0.1:5432/cihub"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting, clippy lints, dependency rules and the rules of AGENTS.md, then lint the dashboard"
depends = ["web-install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
  "scripts/lint-rules.sh",
  "pnpm --dir web lint",
]

[tasks.test]
description = "Run the unit tests, and the tests of the dashboard"
depends = ["web-install"]
run = [
  "cargo nextest run --workspace --no-tests=pass -E 'not binary(postgres)'",
  "pnpm --dir web test",
]

[tasks.web-install]
description = "Install the dependencies of the dashboard, as pnpm-lock.yaml gives them"
run = "pnpm --dir web install --frozen-lockfile"

[tasks.web-build]
description = "Build the dashboard into web/dist, which the next build of cihub-web embeds"
depends = ["web-install"]
run = "pnpm --dir web build"

[tasks.web-shots]
description = "Capture the views of the dashboard, with a mocked API, into web/e2e/__screenshots__/head"
depends = ["web-install"]
run = "web/e2e/visual/shots.sh"

[tasks.web-shots-diff]
description = "Compare the views of the dashboard with the ones of a git ref, into web/e2e/__screenshots__/diff"
depends = ["web-install"]
run = "web/e2e/visual/shots.sh diff"

[tasks.web-fmt]
description = "Format the dashboard with oxfmt, its TypeScript, CSS, JSON and Markdown"
depends = ["web-install"]
run = "pnpm --dir web format"

# The test server creates the database cihub_e2e next to the one of
# DATABASE_URL; its build embeds the dashboard that web-build makes.
[tasks.e2e]
description = "Run the browser tests of the dashboard against a server on the simulator (needs Postgres)"
depends = ["db", "web-build"]
run = [
  "pnpm --dir web exec playwright install chromium",
  "pnpm --dir web e2e",
]

[tasks.web-dev]
description = "Serve the dashboard with Vite, in front of a cihub server start on CIHUB_URL (http://localhost:8080)"
depends = ["web-install"]
run = "pnpm --dir web dev"

[tasks.test-integration]
description = "Run the tests against Postgres (the tests/postgres.rs files)"
depends = ["db"]
run = "cargo nextest run --workspace --no-tests=pass -E 'binary(postgres)'"

[tasks.sim]
description = "Run the fault injection tests, default and batched, on 1 000 seeds"
depends = ["db"]
env = { CIHUB_SIM_SEEDS = "1000" }
run = "cargo nextest run -p cihub-mergequeue -E 'binary(postgres) and test(fault_injection)'"

[tasks.load]
description = "Compare batched and pipelined on the simulated load, and count the useless assemblies"
run = "cargo nextest run -p cihub-mq-core -E 'binary(load)' --run-ignored only"

[tasks.lint-workflows]
description = "Lint the GitHub workflows with actionlint and zizmor"
run = ["actionlint", "zizmor .github/workflows"]

[tasks.helm-lint]
description = "Lint the Helm chart"
run = "helm lint charts/cihub --values charts/cihub/ci/lint-values.yaml"

# helm-unittest is a Helm plugin, which mise cannot install: the task installs
# the pinned version when it is missing.
[tasks.helm-unittest]
description = "Run the template tests of the Helm chart with helm-unittest"
env = { HELM_UNITTEST_VERSION = "1.2.1" }
run = [
  "helm plugin list | grep -q '^unittest' || helm plugin install https://github.com/helm-unittest/helm-unittest --version \"v$HELM_UNITTEST_VERSION\" --verify=false",
  "helm unittest charts/cihub",
]

[tasks.helm-template]
description = "Render the Helm chart with the lint values"
run = "helm template cihub charts/cihub --values charts/cihub/ci/lint-values.yaml"

[tasks.generate]
description = "Generate the README.md and the values.schema.json of the chart from Chart.yaml and values.yaml"
run = [
  "helm-docs --chart-search-root=charts --log-level=warn",
  "helm-schema --chart-search-root charts/cihub --skip-auto-generation required,additionalProperties --append-newline",
]

[tasks.web-generate]
description = "Write the OpenAPI document of the API from the code, then the API client of the dashboard"
depends = ["web-install"]
run = [
  "cargo run --quiet -p cihub-cli --example openapi > web/openapi.json",
  "pnpm --dir web generate",
]

# git diff does not see a new file: git status does.
[tasks.web-generate-check]
description = "Fail if the OpenAPI document or the API client of the dashboard are not up to date"
run = [
  "mise run web-generate",
  "test -z \"$(git status --porcelain web/openapi.json web/src/client)\" || (git status --porcelain web/openapi.json web/src/client; exit 1)",
]

[tasks.generate-check]
description = "Fail if the generated files of the chart are not up to date"
run = [
  "mise run generate",
  "git diff --exit-code charts/cihub/README.md charts/cihub/values.schema.json",
]

[tasks.smoke]
description = "Install the chart with two replicas in a kind cluster against a CloudNativePG Postgres, then check it (needs docker)"
run = "scripts/smoke.sh"

[tasks.cover]
description = "Check the line coverage of the pure crates (90 % or more)"
run = "cargo llvm-cov nextest -p cihub-domain -p cihub-conditions -p cihub-config -p cihub-mq-core --fail-under-lines 90"

[tasks.check]
description = "Run lint, then test"
run = ["mise run lint", "mise run test"]

[tasks.db]
description = "Start the development Postgres of compose.yaml, then create or update the cihub role"
run = [
  "docker compose up --detach --wait postgres",
  "docker compose run --rm postgres-setup",
]

[tasks.db-reset]
description = "Delete the data of the development Postgres, then start it again"
run = ["docker compose down --volumes", "mise run db"]

[tasks.migrate]
description = "Apply the migrations to the development Postgres"
depends = ["db"]
env = { CIHUB_LOG_FORMAT = "pretty" }
run = "cargo run --quiet -p cihub-cli -- server migrate"

[tasks.dev]
description = "Start Postgres, apply the migrations, then run cihub server start with the four roles"
depends = ["migrate"]
env = { CIHUB_LOG_FORMAT = "pretty" }
run = "cargo run --quiet -p cihub-cli -- server start"
